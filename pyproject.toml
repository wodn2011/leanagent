[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leanagent"
version = "0.1.0"
description = "Binary PoC exploit-crafting agent built on deepagents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "deepagents>=0.6.12",
    "langchain-openai>=1.4",
    "langchain-anthropic>=1.5",
    "pydantic>=2",
    "click>=8",
    "rich>=13",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leanagent = "leanagent.cli:main"

[tool.setuptools.packages.find]
include = ["leanagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
